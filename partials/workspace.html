        <!-- UPLOAD SECTION -->
        <section class="upload-section">
            <div id="conversion-status" class="conversion-status" role="status" aria-live="polite" hidden>
                <i data-lucide="cloud-off" aria-hidden="true"></i>
                <span data-converter-message data-i18n="conversion_unavailable">
                    Optional conversion is unavailable right now. EPUB repair still works offline.
                </span>
            </div>
            <div class="conversion-controls">
                <label for="processing-mode" data-i18n="processing_mode_label">Task</label>
                <select id="processing-mode">
                    <option value="repair" data-i18n="repair_mode">Repair EPUB offline</option>
                    <option value="convert" data-i18n="convert_mode">Convert ebook format (online)</option>
                </select>
                <div id="conversion-options" hidden>
                    <label for="conversion-target" data-i18n="conversion_target_label">Convert to</label>
                    <select id="conversion-target">
                        <option value="epub">EPUB</option>
                        <option value="mobi">MOBI</option>
                        <option value="azw3">AZW3</option>
                    </select>
                    <p class="conversion-upload-notice" data-i18n="conversion_upload_notice">
                        Conversion uploads the selected book to Vercel for processing. Files up to 4 MiB; temporary files are deleted after conversion.
                    </p>
                </div>
            </div>
            <div class="drop-zone" id="drop-zone">
                <i class="upload-icon" data-lucide="cloud-upload" aria-hidden="true"></i>
                <p data-i18n="upload">Drag & Drop EPUB files here</p>
                <span data-i18n="upload_hint">or click to browse your computer</span>
                <input id="file" type="file" accept=".epub,.mobi,.azw3" multiple>
            </div>

            <!-- BULK METADATA -->
            <div id="bulk-edit-container" class="apple-card" style="display:none; margin-bottom: 2rem;">
                <h2 data-i18n="bulk" style="margin-bottom: 1rem; font-size: 1.2rem;">Bulk Metadata Edit</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label data-i18n="meta_author" style="font-size: 0.8rem; opacity: 0.7;">Author</label>
                        <input id="bulk-author" type="text"
                            style="width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--apple-card-border); background: var(--apple-card-bg); color: var(--text-primary);">
                    </div>
                    <div class="form-group">
                        <label data-i18n="meta_series" style="font-size: 0.8rem; opacity: 0.7;">Series</label>
                        <input id="bulk-series" type="text"
                            style="width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--apple-card-border); background: var(--apple-card-bg); color: var(--text-primary);">
                    </div>
                </div>
                <button id="apply-bulk-metadata" class="dl-btn btn-secondary" style="margin-top: 1rem; width: 100%;"
                    data-i18n="apply_bulk">Apply to All</button>
            </div>
        </section>

        <!-- STATUS & RESULTS -->
        <section id="results-panel">
            <div id="main_status" role="status" aria-live="polite"></div>
            <div id="results-toolbar" style="display:none;">
                <button id="btnDlAll" class="dl-btn" style="display:none;">
                    <i data-lucide="archive" aria-hidden="true"></i>
                    <span data-i18n="download_all">Download all as ZIP</span>
                </button>
                <button id="btnClearResults" class="dl-btn btn-secondary" style="display:none;">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span data-i18n="clear_results">Clear results</span>
                </button>
            </div>
            <div id="output"></div>
        </section>
