        <!-- UPLOAD SECTION -->
        <section class="upload-section">
            <div class="drop-zone" id="drop-zone">
                <i class="upload-icon" data-lucide="cloud-upload" aria-hidden="true"></i>
                <p data-i18n="upload">Drag & Drop EPUB files here</p>
                <span data-i18n="upload_hint">or click to browse your computer</span>
                <input id="file" type="file" accept=".epub" multiple>
            </div>

            <!-- BULK METADATA -->
            <div id="bulk-edit-container" class="apple-card" style="display:none; margin-bottom: 2rem;">
                <h2 data-i18n="bulk" style="margin-bottom: 1rem; font-size: 1.2rem;">Bulk Metadata Edit</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label data-i18n="meta_author" style="font-size: 0.8rem; opacity: 0.7;">Author</label>
                        <input id="bulk-author" type="text"
                            style="width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--apple-card-border); background: var(--apple-card-bg); color: var(--text-primary);">
                    </div>
                    <div class="form-group">
                        <label data-i18n="meta_series" style="font-size: 0.8rem; opacity: 0.7;">Series</label>
                        <input id="bulk-series" type="text"
                            style="width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--apple-card-border); background: var(--apple-card-bg); color: var(--text-primary);">
                    </div>
                </div>
                <button id="apply-bulk-metadata" class="dl-btn btn-secondary" style="margin-top: 1rem; width: 100%;"
                    data-i18n="apply_bulk">Apply to All</button>
            </div>
        </section>

        <!-- STATUS & RESULTS -->
        <section id="results-panel">
            <div id="main_status" role="status" aria-live="polite"></div>
            <div id="results-toolbar" style="display:none;">
                <button id="btnDlAll" class="dl-btn" style="display:none;">
                    <i data-lucide="archive" aria-hidden="true"></i>
                    <span data-i18n="download_all">Download all as ZIP</span>
                </button>
                <button id="btnClearResults" class="dl-btn btn-secondary" style="display:none;">
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                    <span data-i18n="clear_results">Clear results</span>
                </button>
            </div>
            <div id="output"></div>
        </section>
